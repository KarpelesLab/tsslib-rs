[package]
name = "tsslib"
version = "0.2.12"
edition = "2024"
rust-version = "1.89"
description = "Easy-to-use threshold signature schemes in pure Rust: FROST (Ed25519, ristretto255, secp256k1/Taproot), DKLs23 ECDSA, threshold ML-DSA."
repository = "https://github.com/KarpelesLab/tsslib-rs"
license = "MIT"
keywords = ["tss", "threshold", "frost", "ecdsa", "cryptography"]
categories = ["cryptography"]
readme = "README.md"

[lib]
name = "tsslib"

[features]
# Each protocol is gated so downstream users can compile only what they need;
# each pulls in exactly the purecrypto curve/lattice features it requires.
# `default` pulls in everything.
default = ["std", "json", "frosttss", "frostristretto255tss", "frostsecp256k1tss", "mldsatss", "dklstss", "ecdsatss", "eddsatss"]

# The crate is `#![no_std]` + `alloc`. `std` adds OS randomness (without it,
# register one with `rng::set_entropy_source`), the blocking `wait()` on every
# session, and OS-backed locks in place of spin locks.
std = ["purecrypto/std", "serde/std", "serde_json?/std", "base64?/std", "zeroize/std"]

# JSON keys and messages (serde_json). Without it, keys and messages use only
# the compact binary encoding in `tsslib::wire`, which needs neither std nor
# serde_json. Independent of `std`.
json = ["dep:serde_json", "dep:base64"]

# FROST(Ed25519, SHA-512) — RFC 9591. Ed25519-compatible output.
# cipher/kdf back the X25519+HKDF+ChaCha20-Poly1305 encrypted-share envelope.
frosttss = ["purecrypto/hazmat-edwards25519", "purecrypto/cipher", "purecrypto/kdf"]
# FROST(ristretto255, SHA-512) — RFC 9591 §6.2.
frostristretto255tss = ["purecrypto/ristretto255", "purecrypto/cipher", "purecrypto/kdf"]
# FROST(secp256k1, SHA-256) producing BIP340 Schnorr signatures, with the
# BIP341 Taproot tweak and BIP32 non-hardened derivation. bip340 backs the
# tagged hashes and the final self-check.
frostsecp256k1tss = ["purecrypto/hazmat-secp256k1", "purecrypto/bip340", "purecrypto/cipher", "purecrypto/kdf"]
# Threshold ML-DSA-44 (FIPS 204) — "Threshold Signatures Reloaded".
# hazmat-mldsa exposes the low-level Poly/NTT/sampler/packing API.
mldsatss = ["purecrypto/mldsa", "purecrypto/hazmat-mldsa"]
# Threshold ECDSA on secp256k1 — DKLs23 (ePrint 2023/765).
# cipher backs the AES-CTR PRG in the OT-extension layer.
dklstss = ["purecrypto/hazmat-secp256k1", "purecrypto/cipher"]
# Legacy threshold ECDSA on secp256k1 — GG18/GG20 (Paillier + MtA), for
# migrating keys saved in the legacy GG18/GG20 format. bignum backs the Paillier /
# ZK-proof big-integer arithmetic. EXPERIMENTAL — see the module docs.
ecdsatss = ["purecrypto/hazmat-secp256k1", "purecrypto/bignum", "purecrypto/hash"]
# Legacy threshold EdDSA on Ed25519 — GG18-style (Feldman VSS + threshold
# Schnorr, no Paillier), for migrating keys saved in the legacy GG18 format.
eddsatss = ["purecrypto/hazmat-edwards25519", "purecrypto/hash"]

[dependencies]
# purecrypto provides all low-level crypto (curve groups + ML-DSA lattice
# primitives). Pulled from crates.io so tsslib is itself publishable.
# `hash` and `rng` are unconditional: the always-compiled `tss` module
# re-exports `purecrypto::hash::HashAlgorithm`, and `rng` backs `tsslib::rng`.
purecrypto = { version = "0.9.9", default-features = false, features = ["alloc", "hash", "rng"] }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
# arbitrary_precision: emit/parse big-integer JSON numbers (>2^53) losslessly,
# as the save formats store them.
serde_json = { version = "1", default-features = false, features = ["alloc", "arbitrary_precision"], optional = true }
base64 = { version = "0.22", default-features = false, features = ["alloc"], optional = true }
zeroize = { version = "1", default-features = false, features = ["alloc", "derive"] }
# no_std locks / lazy init (the `std` build uses OS locks for `Mutex`).
spin = { version = "0.10", default-features = false, features = ["spin_mutex", "once"] }

[dev-dependencies]
hex = "0.4"
serde_json = "1"
# Tests always link `std`, so give them OS randomness even under
# `--no-default-features`.
purecrypto = { version = "0.9.9", default-features = false, features = ["std"] }
