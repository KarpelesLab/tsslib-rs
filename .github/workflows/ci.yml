name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # purecrypto is a git dependency; fetch it via the git CLI for reliable
  # anonymous HTTPS cloning of the public repo.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  test:
    name: Test & lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Format
        if: runner.os == 'Linux' # formatting is platform-independent
        run: cargo fmt --all --check

      - name: Clippy (all features, warnings denied)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test (all features)
        run: cargo test --all-features

      - name: Test (no default features)
        run: cargo test --no-default-features

      # The legacy ecdsatss fixtures (frozen keys in the GG18/GG20 save format)
      # must keep loading and signing. Ignored in debug builds for speed; a few
      # seconds in release.
      - name: Sign with frozen ecdsatss fixture keys
        if: runner.os == 'Linux'
        run: cargo test --release --lib --no-default-features --features std,ecdsatss fixture_keys_sign -- --ignored

      - name: Clippy (each protocol feature alone)
        if: runner.os == 'Linux' # feature gating is platform-independent
        shell: bash
        run: |
          for f in frosttss frostristretto255tss frostsecp256k1tss mldsatss dklstss ecdsatss eddsatss; do
            echo "::group::$f"
            cargo clippy --no-default-features --features "$f" --all-targets -- -D warnings
            echo "::endgroup::"
          done

  no_std:
    name: no_std build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Bare-metal targets have no `std` at all, so any std leak fails to link.
        target: [thumbv7em-none-eabihf, x86_64-unknown-none, wasm32-unknown-unknown]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Clippy (all protocols, no std)
        run: >-
          cargo clippy --target ${{ matrix.target }} --no-default-features
          --features frosttss,frostristretto255tss,frostsecp256k1tss,mldsatss,dklstss,ecdsatss,eddsatss
          -- -D warnings

  docs:
    name: Docs build (warnings denied)
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings -D rustdoc::broken-intra-doc-links
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: cargo doc --no-deps --all-features
        run: cargo doc --no-deps --all-features
